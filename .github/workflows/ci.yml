name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Spotify SDK AARs
        run: ./install_dependencies.sh

      - name: Generate placeholder secrets
        # secrets.xml is not committed. The real values are only needed to talk to
        # Spotify at runtime; compiling, unit tests and lint just need the resources
        # to resolve.
        run: |
          cat > app/src/main/res/values/secrets.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="spotify_client_id">ci_placeholder_client_id</string>
              <string name="spotify_client_secret">ci_placeholder_client_secret</string>
              <string name="redirect_uri">tunaro://callback</string>
          </resources>
          XML

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
